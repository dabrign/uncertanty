[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-uncertainty"
version = "0.1.0"
description = "End-to-End Uncertainty Quantification for Multimodal Agent & Structured Extraction Pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "llm",
    "vlm",
    "uncertainty-quantification",
    "perplexity",
    "semantic-entropy",
    "structured-outputs",
    "gemini",
    "vllm",
    "pydantic"
]
authors = [
    { name = "Multimodal UQ Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "requests>=2.28.0",
    "numpy>=1.22.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.0"]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
litellm = ["litellm>=1.0.0"]
all = [
    "vllm>=0.29.0",
    "fastapi>=0.141.1",
    "litellm>=1.0.0",
    "pillow>=9.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pillow>=9.0.0"
]

[project.urls]
Homepage = "https://github.com/your-org/multimodal-uncertainty"
Documentation = "https://your-org.github.io/multimodal-uncertainty/"
Repository = "https://github.com/your-org/multimodal-uncertainty"
Issues = "https://github.com/your-org/multimodal-uncertainty/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_uncertainty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

name: Publish to PyPI

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
  push:
    branches: ["feat/*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - stable

permissions:
  id-token: write

jobs:
  build-n-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install hatch build

      - name: Set alpha version
        if: >-
          github.event_name == 'pull_request'
          || startsWith(github.ref_name, 'feat/')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'alpha')
        run: |
          ALPHA_NUM=$(git rev-list --count HEAD)
          sed -i "s/^version = \".*\"/version = \"0.1.0a${ALPHA_NUM}\"/" pyproject.toml
          echo "Publishing alpha: 0.1.0a${ALPHA_NUM}"

      - name: Build Package
        run: python -m build

      - name: Publish to PyPI
        if: >-
          github.event_name == 'release'
          || github.event_name == 'pull_request'
          || startsWith(github.ref_name, 'feat/')
          || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1

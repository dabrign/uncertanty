name: CI Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest & Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Code Formatting (Black)
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ] || [ "${{ matrix.python-version }}" = "3.11" ]; then
            black --check --line-length 100 --fast src tests utils
          else
            black --check --line-length 100 src tests utils
          fi

      - name: Run Ruff Linting
        run: |
          ruff check src tests utils

      - name: Run Pytest Suite
        run: |
          pytest -v
